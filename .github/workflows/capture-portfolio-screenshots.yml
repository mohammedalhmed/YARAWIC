name: Capture Portfolio Screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/capture-portfolio-screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm install -g playwright@1.55.0
          playwright install --with-deps chromium

      - name: Capture live screenshots
        run: |
          mkdir -p docs/screenshots
          playwright screenshot --browser=chromium --full-page --viewport-size="1440,900" https://mohammedalhmed.github.io/YARAWIC/ docs/screenshots/home-desktop.png
          playwright screenshot --browser=chromium --full-page --viewport-size="390,844" https://mohammedalhmed.github.io/YARAWIC/ docs/screenshots/home-mobile.png

      - name: Commit screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Capture YARAWIC portfolio screenshots"
          file_pattern: "docs/screenshots/*.png"
